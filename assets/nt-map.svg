<style>
  .land { fill: #e3f0f2; stroke: #0d6e7d; stroke-width: 2; stroke-linejoin: round; }
  .dot { fill: #0d6e7d; }
  .ring { fill: none; stroke: #008c9e; stroke-width: 2; transform-box: fill-box; transform-origin: center;
          animation: pulse 2.5s ease-out infinite; opacity: 0; }
