# Check the NT Government open data portal for a newer crime statistics
# release, rebuild the master dataset, validate it, and publish only if every
# safety check passes.
#
# The NT publishes monthly, roughly five weeks after the crime month ends, and
# the exact day varies. A daily check is cheap (one CKAN query plus a few CSV
# fetches) and means a new release is picked up within 24 hours. Nothing is
# committed on days when there is no new month.
name: Update NT crime data

on:
  schedule:
    - cron: "17 19 * * *"     # 04:47 ACST daily, off the hour to avoid load spikes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only - do not commit or publish"
        type: boolean
        default: false

concurrency:
  group: nt-crime-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2" "certifi>=2024.0" kaggle

      - name: Verify commit identity
        run: |
          git config user.name  "harshrastogii"
          git config user.email "harshrastogi636@gmail.com"
          NAME="$(git config user.name)"
          EMAIL="$(git config user.email)"
          echo "commit identity: $NAME <$EMAIL>"
          if [ "$NAME" != "harshrastogii" ] || [ "$EMAIL" != "harshrastogi636@gmail.com" ]; then
            echo "::error::Git identity is not the expected one - refusing to continue"
            exit 1
          fi

      - name: Run the safety test suite
        run: python tests/test_safety.py

      - name: Check the portal for a newer release
        id: check
        run: |
          set +e
          python -m pipeline.update --check
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Update the dataset
        id: update
        if: steps.check.outputs.status == '3'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pipeline.update --dry-run
          else
            python -m pipeline.update
          fi

      - name: Stop if the portal could not be understood
        if: steps.check.outputs.status == '1' || steps.check.outputs.status == '2'
        run: |
          echo "::error::The pipeline stopped. The NT portal returned something \
          it could not confidently interpret, or a safety check failed. \
          Nothing was published. See the log above and kaggle/UPDATE_REPORT.md."
          exit 1

      - name: Commit and push
        if: steps.update.outputs.updated == 'true' && inputs.dry_run != true
        run: |
          git add kaggle/nt_crime_master.csv kaggle/UPDATE_REPORT.md data/manifest.json data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Update NT crime data through ${{ steps.update.outputs.latest_month_name }}"
          git push

      - name: Publish the new version to Kaggle
        if: steps.update.outputs.updated == 'true' && inputs.dry_run != true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::warning::Kaggle credentials are not configured. \
            GitHub was updated; Kaggle was not. Add the KAGGLE_API_TOKEN \
            repository secret to enable automatic publishing."
            exit 0
          fi
          python -m pipeline.publish_kaggle \
            --message "Update through ${{ steps.update.outputs.latest_month_name }}"

      - name: Upload the update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report
          path: kaggle/UPDATE_REPORT.md
          if-no-files-found: ignore
