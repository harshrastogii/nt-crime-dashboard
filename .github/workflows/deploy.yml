# Auto-deploy to Hugging Face Spaces on every push to main.
# When you push a new CSV (or any change) to GitHub, this pushes it to your
# Space, which rebuilds and updates the live dashboard automatically.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you trigger it manually from the Actions tab

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git rm --cached -r --ignore-unmatch "*.png" "*.jpg" "*.jpeg" "*.ico" >/dev/null 2>&1 || true
          git commit -m "strip images for HF" >/dev/null 2>&1 || true
          git push https://harshrastogii:$HF_TOKEN@huggingface.co/spaces/harshrastogii/nt-crime-dashboard main --force
